name: I18n inventory
on:
  pull_request:
    branches: [beta, main]
    paths: ['src/**', 'messages/**', 'scripts/i18n/**', 'package.json', 'bun.lock', '.github/workflows/i18n-*.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Find missing localization without building
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run i18n:auto:check -- --base "$BASE_SHA"
